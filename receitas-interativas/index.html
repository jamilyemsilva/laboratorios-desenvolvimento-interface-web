<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas Interativas</title>
</head>
<body>
    <header>
        <h1>Pão de Queijo Mineiro Tradicional</h1>

        <p>
            Uma receita tradicional de Minas Gerais:
            crocante por fora e macia por dentro.
        </p>

        <img
            src="https://via.placeholder.com/400x200?text=Pao+de+Queijo"
            alt="Pães de queijo"
        >
    </header>
    <section>
        <button popovertarget="segredo">
            Ver Segredo do Chef
        </button>

        <div id="segredo" popover>
            <h2>O segredo da receita</h2>

            <p>
                Evite adicionar os ovos enquanto a massa ainda estiver muito quente.
            </p>
        </div>
    </section>
</body>
</html>
