<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <header id="topo">
        <h1>Login Da Página</h1>
        <p>Preencha seus dados de acesso a plataforma</p>
    </header>

    <nav>
        <a href="index.html">Voltar para o evento</a>
        <a href="#form"></a>
    </nav>

    <main>
        <section id=" form">
            <form action="">
                <fieldset>
                    <legend>Dados de Acesso</legend>

                    <p>
                        <label for="email">E-mail</label>
                        <input 
                            type="email"
                            id="email"
                            name="email"
                            required
                        >
                    </p>
                    <p>
                        <label for="senha">Senha</label>
                        <input 
                            type="password"
                            id="senha"
                            name="senha"
                            required
                        >
                    </p>
                    <button type="submit">
                        Entrar
                    </button>
                </fieldset>
            </form>
        </section> 
    </main>
     
    <footer>
        <p>
            DevWeb Conference 2026
        </p>
        <p>
            Desenvolvimento de Interfaces  Web
        </p>
        <p>
            <a href="#topo">Voltar ao topo</a>
        </p>
    </footer>
    
</body>
</html>
